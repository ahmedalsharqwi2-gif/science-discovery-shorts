name: Daily publish status (3 repositories)

on:
  # 18:00 UTC is after both Cairo publication slots in either Cairo offset.
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Build daily publication report
        id: report
        run: |
          python - <<'PY'
          import json
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo

          import base64
          from datetime import timedelta

          repos = [
              ("science-discovery-shorts", "العلوم", {"tiktok", "youtube", "facebook"}),
              ("documented-history-stories", "التاريخ الموثق", {"facebook", "instagram", "youtube"}),
              ("arabic-horror-stories", "القصص المرعبة", {"facebook", "instagram", "youtube"}),
          ]
          owner = "ahmedalsharqwi2-gif"
          cairo = ZoneInfo("Africa/Cairo")
          now = datetime.now(timezone.utc).astimezone(cairo)
          today = now.date()
          rows = []
          failed = False

          def confirmed(entry, required):
              receipts = entry.get("receipts", {})
              return entry.get("confirmed") is True and all(
                  receipts.get(service, {}).get("id") for service in required
              )

          def summarize(slots, required, current):
              day = current.date()
              today_targets = [
                  current.replace(hour=hour, minute=0, second=0, microsecond=0)
                  for hour in (12, 18)
              ]
              def key(target):
                  return f"stock {target.date().isoformat()} {target.hour:02d} Cairo"
              accepted = sum(confirmed(slots.get(key(t), {}), required) for t in today_targets)
              overdue = sum(t <= current and not confirmed(slots.get(key(t), {}), required)
                            for t in today_targets)
              future = [
                  current.replace(hour=hour, minute=0, second=0, microsecond=0) + timedelta(days=offset)
                  for offset in range(5) for hour in (12, 18)
              ]
              future = [t for t in future if t > current]
              stocked = sum(confirmed(slots.get(key(t), {}), required) for t in future)
              state = "MISSING" if overdue else ("ACCEPTED" if accepted == 2 else "PENDING")
              detail = (f"قبول جدولة اليوم: {accepted}/2؛ المخزون القادم: {stocked}/{len(future)}. "
                        "الإيصال يؤكد قبول المنصة للجدولة، ولا يثبت ظهور الفيديو للجمهور.")
              if overdue:
                  detail += f" مواعيد مضت بلا إيصال كامل: {overdue}."
              return state, detail, bool(overdue)

          for repo, label, required in repos:
              url = f"https://api.github.com/repos/{owner}/{repo}/contents/state/publication_stock.json"
              request = urllib.request.Request(
                  url,
                  headers={"Accept": "application/vnd.github+json", "User-Agent": "daily-publish-status"},
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      payload = json.load(response)
                  ledger = json.loads(base64.b64decode(payload["content"]))
                  state, detail, missing = summarize(ledger.get("slots", {}), required, now)
                  failed = failed or missing
                  rows.append((label, state, detail,
                               f"[إيصالات]({f'https://github.com/{owner}/{repo}/blob/main/state/publication_stock.json'})"))
              except (urllib.error.URLError, ValueError, KeyError, TypeError) as exc:
                  rows.append((label, "API ERROR", str(exc), ""))
                  failed = True

          generated = datetime.now(cairo).strftime("%Y-%m-%d %H:%M %Z")
          lines = [f"# تقرير النشر اليومي — {generated}", "", f"الموعد المحلي المفحوص: {today}", ""]
          lines.append("| المستودع | الحالة | التفاصيل | السجل |")
          lines.append("|---|---|---|---|")
          for label, state, detail, url in rows:
              link = url or "—"
              lines.append(f"| {label} | **{state}** | {detail} | {link} |")
          report = "\n".join(lines) + "\n"
          with open("daily-publish-report.md", "w", encoding="utf-8") as output:
              output.write(report)
          with open("/tmp/daily-publish-report.txt", "w", encoding="utf-8") as output:
              output.write(report)
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"], "w", encoding="utf-8") as output:
              output.write(report)
          print(report)
          if failed:
              raise SystemExit("Missing complete acceptance receipts for elapsed publication slots or ledger unavailable")
          PY

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: daily-publish-report
          path: daily-publish-report.md
          retention-days: 30

      - name: Send Telegram alert
        if: ${{ always() && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import urllib.parse
          import urllib.request

          report = open("/tmp/daily-publish-report.txt", encoding="utf-8").read()
          payload = urllib.parse.urlencode({
              "chat_id": os.environ["TELEGRAM_CHAT_ID"],
              "text": report[:3900],
          }).encode()
          url = f"https://api.telegram.org/bot{os.environ['TELEGRAM_BOT_TOKEN']}/sendMessage"
          request = urllib.request.Request(url, data=payload, method="POST")
          with urllib.request.urlopen(request, timeout=30) as response:
              response.read()
          PY
