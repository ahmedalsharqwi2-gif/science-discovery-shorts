{
  "name": "Professional pipeline regression checks",
  "on": {
    "push": {
      "paths": [
        "professional_motion/**",
        "tests/test_daily_professional.py",
        "tests/test_professional_motion.py",
        ".github/workflows/professional-pipeline-validation.yml",
        "tests/test_professional_policy.py"
      ]
    },
    "pull_request": {
      "paths": [
        "professional_motion/**",
        "tests/test_daily_professional.py",
        "tests/test_professional_motion.py",
        ".github/workflows/professional-pipeline-validation.yml",
        "tests/test_professional_policy.py"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "test": {
      "runs-on": "ubuntu-24.04",
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.11"
          }
        },
        {
          "run": "python -m pip install numpy Pillow requests beautifulsoup4"
        },
        {
          "run": "python -m unittest discover -s tests -p test_daily_professional.py -q\npython -m compileall -q professional_motion\nnode --check professional_motion/channels.js\nnode --check professional_motion/scene.js\nnode --check professional_motion/render.mjs\npython -m unittest discover -s tests -p test_professional_policy.py -q\nnode --check professional_motion/haunted.js"
        }
      ]
    }
  }
}
