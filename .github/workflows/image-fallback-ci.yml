name: Image fallback CI
on:
  push:
    paths:
      - 'film_factory/image_fallback.py'
      - 'film_factory/images.py'
      - 'news/images.py'
      - 'tests/test_image_fallback.py'
      - '.github/workflows/image-fallback-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pillow requests
      - run: python -m unittest discover -s tests -p 'test_image_fallback.py' -v
