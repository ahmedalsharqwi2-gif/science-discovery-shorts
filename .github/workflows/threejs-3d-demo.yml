name: Three.js Linux cinematic demo (no publishing)
on:
  push:
    paths:
      - '.github/workflows/threejs-3d-demo.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update -qq && sudo apt-get install -y chromium ffmpeg
      - run: python -m pip install playwright
      - run: npm install --no-save --prefix motion_3d three@0.186.0
      - name: Render real animated Three.js scene
        run: |
          cd motion_3d
          python render.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: battle-3d-linux-demo-${{ github.run_id }}
          path: |
            motion_3d/battle-3d-proof.mp4
            motion_3d/battle-3d-proof.jpg
          retention-days: 14
