{
  "name": "Automatic Remotion — configured Cairo production and publication",
  "on": {
    "schedule": [
      {
        "cron": "0 6 * * *"
      },
      {
        "cron": "17 6 * * *"
      },
      {
        "cron": "0 7 * * *"
      },
      {
        "cron": "17 7 * * *"
      },
      {
        "cron": "0 16 * * *"
      },
      {
        "cron": "17 16 * * *"
      },
      {
        "cron": "0 17 * * *"
      },
      {
        "cron": "17 17 * * *"
      }
    ],
    "workflow_dispatch": {
      "inputs": {
        "publish_date": {
          "description": "Optional explicit future publication date YYYY-MM-DD; never roll expired slots",
          "type": "string",
          "required": false
        },
        "dry_run": {
          "description": "Queue/time checks only; no generation or posting",
          "type": "boolean",
          "default": false
        },
        "render_only": {
          "description": "Render and validate a real video artifact, but skip all external publishing",
          "type": "boolean",
          "default": false
        },
        "trigger_source": {
          "description": "Declared initiating service; tests/manual actions are never treated as an actual automatic clock",
          "type": "choice",
          "options": [
            "manual",
            "cloudflare-clock",
            "cloudflare-clock-test"
          ],
          "default": "manual",
          "required": false
        }
      }
    },
    "push": {
      "branches": [
        "main"
      ],
      "paths": [
        ".github/remotion-daily-request.json",
        ".github/remotion-time-change.json"
      ]
    }
  },
  "permissions": {
    "contents": "write",
    "actions": "read"
  },
  "concurrency": {
    "group": "professional-daily-science",
    "cancel-in-progress": false
  },
  "jobs": {
    "daily": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 100,
      "env": {
        "PYTHONPATH": "${{ github.workspace }}",
        "PYTHONUNBUFFERED": "1",
        "GITHUB_TOKEN": "${{ github.token }}",
        "BUFFER_API_KEY": "${{ secrets.BUFFER_API_KEY }}",
        "GEMINI_API_KEY": "${{ secrets.GEMINI_API_KEY }}",
        "GEMINI_TEXT_API_KEY": "${{ secrets.GEMINI_TEXT_API_KEY || secrets.GEMINI_API_KEY }}",
        "GEMINI_TTS_API_KEY": "${{ secrets.GEMINI_TTS_API_KEY || secrets.GEMINI_API_KEY }}",
        "NODE_USE_ENV_PROXY": "1",
        "GEMINI_TTS_VOICE": "Charon",
        "REMOTION_PROFILE": "science"
      },
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "ref": "main",
            "fetch-depth": 0
          }
        },
        {
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.11"
          }
        },
        {
          "name": "Install planning prerequisites",
          "run": "python -m pip install --disable-pip-version-check --timeout 30 --retries 2 requests beautifulsoup4 Pillow numpy pyyaml",
          "timeout-minutes": 5
        },
        {
          "name": "Install media probe tools before retained-media preflight",
          "run": "if [ -f /etc/apt/apt-mirrors.txt ]; then printf '%s\\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null; fi\nif [ -f /etc/apt/apt-mirrors-security.txt ]; then printf '%s\\n' 'https://security.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors-security.txt >/dev/null; fi\ntimeout 240s sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 update -qq\ntimeout 240s sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 install -y --no-install-recommends ffmpeg",
          "timeout-minutes": 8,
          "env": {
            "DEBIAN_FRONTEND": "noninteractive"
          }
        },
        {
          "name": "Freeze original date; verify configured Cairo clock and existing queues",
          "id": "decision",
          "run": "python -m remotion_factory.daily --decide-only ${{ inputs.dry_run && '--dry-run' || '' }}"
        },
        {
          "uses": "actions/setup-node@v4",
          "if": "steps.decision.outputs.run == 'true'",
          "with": {
            "node-version": "24"
          }
        },
        {
          "name": "Install exact renderer, measured speech and audio prerequisites",
          "if": "steps.decision.outputs.run == 'true'",
          "run": "if [ -f /etc/apt/apt-mirrors.txt ]; then printf '%s\\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null; fi\nif [ -f /etc/apt/apt-mirrors-security.txt ]; then printf '%s\\n' 'https://security.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors-security.txt >/dev/null; fi\ntimeout 240s sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 update -qq\ntimeout 240s sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 install -y --no-install-recommends ffmpeg fonts-noto-core libnss3 libgbm1 libasound2t64\npython -m pip install faster-whisper==1.2.1 google-genai google-auth num2words\nnpm ci --prefix professional_motion --no-audit --no-fund\ncd remotion_motion\nnpm ci --no-audit --no-fund\nnpx remotion browser ensure\nnpm run check",
          "timeout-minutes": 15,
          "env": {
            "DEBIAN_FRONTEND": "noninteractive"
          }
        },
        {
          "uses": "actions/cache@v4",
          "if": "steps.decision.outputs.run == 'true'",
          "with": {
            "path": "~/.cache/huggingface\n.voice_cache\nstate/api_budget.sqlite3",
            "key": "remotion-daily-science-${{ github.run_id }}-${{ github.run_attempt }}",
            "restore-keys": "remotion-daily-science-\nprofessional-v3-${{ github.repository_id }}-"
          }
        },
        {
          "name": "Verify date, deduplication and uncertain-send safety regressions",
          "run": "python -m unittest discover -s remotion_factory/tests -q"
        },
        {
          "name": "New topic → retained voice → Remotion → full decode → verified configured-time scheduling",
          "if": "steps.decision.outputs.run == 'true'",
          "run": "python -m remotion_factory.daily ${{ inputs.render_only && '--render-only' || '' }}"
        },
        {
          "uses": "actions/upload-artifact@v4",
          "if": "always()",
          "with": {
            "name": "remotion-voice-${{ github.run_id }}-${{ github.run_attempt }}",
            "path": "professional_motion/delivery/\nstate/remotion_registry.json",
            "retention-days": 90,
            "if-no-files-found": "warn"
          }
        },
        {
          "uses": "actions/upload-artifact@v4",
          "if": "always()",
          "with": {
            "name": "remotion-complete-science-${{ github.run_id }}",
            "path": "professional_motion/output/\nprofessional_motion/delivery/\nstate/remotion_registry.json",
            "retention-days": 90,
            "if-no-files-found": "warn"
          }
        }
      ],
      "if": "github.event_name != 'push' || !contains(github.event.head_commit.message, '[schedule-migration]')"
    },
    "adjust_time": {
      "if": "github.event_name == 'push' && contains(github.event.head_commit.message, '[schedule-migration]')",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 15,
      "env": {
        "GITHUB_TOKEN": "${{ github.token }}",
        "BUFFER_API_KEY": "${{ secrets.BUFFER_API_KEY }}",
        "PYTHONUNBUFFERED": "1"
      },
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "ref": "main",
            "fetch-depth": 1
          }
        },
        {
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.11"
          }
        },
        {
          "name": "Install schedule-only prerequisites",
          "run": "python -m pip install requests beautifulsoup4 Pillow"
        },
        {
          "name": "Verify civil-time and retained-ID safety regressions",
          "run": "python -m unittest discover -s remotion_factory/tests -q"
        },
        {
          "name": "Move exact approved existing post IDs to noon; no new media or posts",
          "run": "python -m remotion_factory.schedule_migration"
        },
        {
          "uses": "actions/upload-artifact@v4",
          "if": "always()",
          "with": {
            "name": "schedule-change-${{ github.run_id }}",
            "path": "reviews/schedule_changes/",
            "retention-days": 90
          }
        }
      ]
    }
  }
}
