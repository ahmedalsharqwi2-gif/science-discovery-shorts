{
  "name": "Read-only official science source fit probe",
  "on": {
    "workflow_dispatch": {},
    "push": {
      "branches": [
        "codex/rebuild-production-v2"
      ],
      "paths": [
        ".github/production-v2-source-request.json"
      ]
    }
  },
  "permissions": {
    "contents": "write"
  },
  "jobs": {
    "probe": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      "env": {
        "GITHUB_TOKEN": "${{ github.token }}"
      },
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "fetch-depth": 0
          }
        },
        {
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.11"
          }
        },
        {
          "run": "python -m pip install requests beautifulsoup4"
        },
        {
          "run": "python -m production_v2.source_probe --profile science --request .github/production-v2-source-request.json"
        }
      ]
    }
  }
}
