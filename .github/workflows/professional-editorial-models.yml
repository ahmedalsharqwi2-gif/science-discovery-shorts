{
  "name": "Read-only editorial model capabilities",
  "on": {
    "push": {
      "branches": [
        "codex/daily-professional-factory"
      ],
      "paths": [
        ".github/workflows/professional-editorial-models.yml"
      ]
    }
  },
  "permissions": {
    "contents": "write"
  },
  "jobs": {
    "probe": {
      "runs-on": "ubuntu-latest",
      "env": {
        "PYTHONPATH": "${{ github.workspace }}",
        "PYTHONUNBUFFERED": "1",
        "GEMINI_API_KEY": "${{ secrets.GEMINI_API_KEY }}",
        "GEMINI_TEXT_API_KEY": "${{ secrets.GEMINI_TEXT_API_KEY || secrets.GEMINI_API_KEY }}",
        "GEMINI_TTS_API_KEY": "${{ secrets.GEMINI_TTS_API_KEY || secrets.GEMINI_API_KEY }}",
        "GITHUB_TOKEN": "${{ github.token }}",
        "GH_RELEASE_TOKEN": "${{ secrets.GH_RELEASE_TOKEN }}",
        "BUFFER_API_KEY": "${{ secrets.BUFFER_API_KEY }}",
        "BUFFER_CHANNEL_IDS": "${{ secrets.BUFFER_CHANNEL_IDS || vars.BUFFER_CHANNEL_IDS }}",
        "YT_CLIENT_ID": "${{ secrets.YT_CLIENT_ID }}",
        "YT_CLIENT_SECRET": "${{ secrets.YT_CLIENT_SECRET }}",
        "YT_REFRESH_TOKEN": "${{ secrets.YT_REFRESH_TOKEN }}",
        "YT_REFRESH_TOKEN_FALLBACK": "${{ secrets.YT_REFRESH_TOKEN_FALLBACK }}",
        "BUFFER_YOUTUBE_CHANNEL_ID": "${{ secrets.BUFFER_YOUTUBE_CHANNEL_ID }}",
        "BUFFER_FACEBOOK_CHANNEL_ID": "${{ secrets.BUFFER_FACEBOOK_CHANNEL_ID }}",
        "BUFFER_INSTAGRAM_CHANNEL_ID": "${{ secrets.BUFFER_INSTAGRAM_CHANNEL_ID }}",
        "BUFFER_TIKTOK_CHANNEL_ID": "${{ secrets.BUFFER_TIKTOK_CHANNEL_ID }}"
      },
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.11"
          }
        },
        {
          "run": "python -m pip install requests beautifulsoup4 google-api-python-client google-auth-oauthlib"
        },
        {
          "name": "List supported writing model names without generating media",
          "run": "python professional_motion/check_editorial_models.py"
        }
      ]
    }
  }
}
