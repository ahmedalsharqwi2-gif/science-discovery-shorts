name: Professional full-length daily film — science
'on':
  workflow_dispatch:
    inputs:
      pipeline:
        description: Explicit v2 candidate review never publishes; legacy remains default
        type: choice
        options:
        - legacy
        - v2
        default: legacy
      mode:
        description: Review never publishes; daily requires the approved release
        type: choice
        options:
        - review
        - daily
        default: review
      review_style:
        description: Visual style for review films only; approved daily films keep their existing style
        type: choice
        options:
        - reference
        - original
        default: reference
  schedule:
  - cron: 55 17 * * *
  workflow_call:
    inputs:
      pipeline:
        type: string
        default: legacy
        required: false
      mode:
        type: string
        default: review
        required: false
      review_style:
        type: string
        default: reference
        required: false
permissions:
  contents: write
  actions: read
concurrency:
  group: professional-daily-science
  cancel-in-progress: false
jobs:
  v2-candidate-review:
    if: ${{ inputs.pipeline == 'v2' }}
    uses: ./.github/workflows/production-v2-generate.yml
    with:
      caller_serialized: true
    secrets: inherit
  produce:
    if: ${{ inputs.pipeline != 'v2' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUNBUFFERED: '1'
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_TEXT_API_KEY: ${{ secrets.GEMINI_TEXT_API_KEY || secrets.GEMINI_API_KEY }}
      GEMINI_TTS_API_KEY: ${{ secrets.GEMINI_TTS_API_KEY || secrets.GEMINI_API_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
      GH_RELEASE_TOKEN: ${{ github.token }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_CHANNEL_IDS: ${{ secrets.BUFFER_CHANNEL_IDS || vars.BUFFER_CHANNEL_IDS }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      YT_REFRESH_TOKEN_FALLBACK: ${{ secrets.YT_REFRESH_TOKEN_FALLBACK }}
      BUFFER_YOUTUBE_CHANNEL_ID: ${{ secrets.BUFFER_YOUTUBE_CHANNEL_ID }}
      BUFFER_FACEBOOK_CHANNEL_ID: ${{ secrets.BUFFER_FACEBOOK_CHANNEL_ID }}
      BUFFER_INSTAGRAM_CHANNEL_ID: ${{ secrets.BUFFER_INSTAGRAM_CHANNEL_ID }}
      BUFFER_TIKTOK_CHANNEL_ID: ${{ secrets.BUFFER_TIKTOK_CHANNEL_ID }}
      HORROR_REVIEW_GENRE: ${{ inputs.horror_genre || '' }}
      FACTORY_DAILY: ${{ inputs.mode == 'daily' || github.event_name == 'schedule' }}
    outputs:
      run: ${{ steps.decision.outputs.run }}
      publish: ${{ steps.decision.outputs.publish }}
      due: ${{ steps.decision.outputs.due }}
      slot: ${{ steps.decision.outputs.slot }}
      sha: ${{ steps.source.outputs.sha }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: ${{ github.ref_name }}
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install planning prerequisites
      run: python -m pip install requests beautifulsoup4
    - name: Check review approval and Cairo civil-time guard
      id: decision
      run: python -m professional_motion.cli decision science --mode "${{ inputs.mode || 'review' }}"
    - name: Install narration and alignment dependencies
      if: steps.decision.outputs.run == 'true'
      run: 'sudo apt-get update -qq

        sudo apt-get install -y ffmpeg

        python -m pip install numpy Pillow faster-whisper==1.2.1 google-api-python-client google-auth-oauthlib'
    - uses: actions/cache/restore@v4
      if: steps.decision.outputs.run == 'true'
      with:
        path: '.voice_cache

          state/api_budget.sqlite3

          ~/.cache/huggingface'
        key: professional-v3-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: 'professional-v3-${{ github.repository_id }}-

          professional-v2-${{ github.repository_id }}-

          octopus-proof-'
    - name: Author a different full-length story, source claims, title and topical hashtags
      id: prepare
      if: steps.decision.outputs.run == 'true'
      run: python -m professional_motion.cli prepare science --slot "${{ steps.decision.outputs.slot }}"
    - name: Persist the reserved plot before any synthesis
      if: steps.prepare.outcome == 'success'
      run: python -m professional_motion.persist_state
    - name: Verify the confirmed destination accounts without posting
      if: steps.prepare.outcome == 'success'
      run: 'python - <<''PY2''

        from professional_motion.publisher import preflight

        r=preflight(''science'',True)

        assert len(r[''buffer''])==3 and not r[''direct_youtube''], ''Three verified destinations are required''

        PY2'
    - name: Resume an interrupted exact original voice if available
      if: steps.prepare.outcome == 'success'
      run: python -m professional_motion.resume_voice
    - name: Generate the complete original voice and measure speech/reveal timing
      id: voice
      if: steps.prepare.outcome == 'success'
      run: python -m professional_motion.voice_job
    - name: Record the exact source revision used for narration
      id: source
      if: steps.voice.outcome == 'success'
      run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
    - uses: actions/upload-artifact@v4
      if: steps.voice.outcome == 'success'
      with:
        name: original-voice-${{ github.run_id }}
        path: professional_motion/delivery/
        retention-days: 30
        if-no-files-found: error
    - uses: actions/cache/save@v4
      if: always() && steps.decision.outputs.run == 'true'
      with:
        path: '.voice_cache

          state/api_budget.sqlite3

          ~/.cache/huggingface'
        key: professional-v3-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}
    - name: Persist same-episode narration feedback even when voice validation fails
      if: always() && steps.prepare.outcome == 'success'
      run: python -m professional_motion.persist_state
    - name: Deliver safe original narration evidence even when production stops
      if: always() && steps.decision.outputs.run == 'true'
      env:
        REVIEW_STAGE: voice
        REVIEW_ONLY: ${{ steps.decision.outputs.publish != 'true' }}
      run: python -m professional_motion.review_evidence
  render:
    needs: produce
    if: needs.produce.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        part:
        - 0
        - 1
        - 2
        - 3
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ needs.produce.outputs.sha }}
    - uses: actions/download-artifact@v4
      with:
        name: original-voice-${{ github.run_id }}
        path: professional_motion/delivery/
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install exact renderer and browser
      run: 'sudo apt-get update -qq

        sudo apt-get install -y ffmpeg

        cd professional_motion

        npm ci

        npx playwright-core install --with-deps chromium'
    - name: Render an exact quarter of the real-timing full-resolution frames
      run: 'args=(--style "$REVIEW_VISUAL_STYLE")

        if [ "$IS_REVIEW" = "true" ]; then args+=(--review); fi

        node professional_motion/render.mjs "${args[@]}" --part ${{ matrix.part }} --parts 4 --output chunk-${{ matrix.part }}.mp4'
      env:
        REVIEW_VISUAL_STYLE: ${{ needs.produce.outputs.publish == 'true' && 'original' || inputs.review_style || 'reference' }}
        IS_REVIEW: ${{ needs.produce.outputs.publish != 'true' }}
    - uses: actions/upload-artifact@v4
      with:
        name: frames-${{ matrix.part }}
        path: 'professional_motion/output/chunk-${{ matrix.part }}.mp4

          professional_motion/output/chunk-${{ matrix.part }}.mp4.json'
        retention-days: 7
        if-no-files-found: error
  finish:
    needs:
    - produce
    - render
    if: needs.produce.outputs.run == 'true' && needs.render.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUNBUFFERED: '1'
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_TEXT_API_KEY: ${{ secrets.GEMINI_TEXT_API_KEY || secrets.GEMINI_API_KEY }}
      GEMINI_TTS_API_KEY: ${{ secrets.GEMINI_TTS_API_KEY || secrets.GEMINI_API_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
      GH_RELEASE_TOKEN: ${{ github.token }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_CHANNEL_IDS: ${{ secrets.BUFFER_CHANNEL_IDS || vars.BUFFER_CHANNEL_IDS }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      YT_REFRESH_TOKEN_FALLBACK: ${{ secrets.YT_REFRESH_TOKEN_FALLBACK }}
      BUFFER_YOUTUBE_CHANNEL_ID: ${{ secrets.BUFFER_YOUTUBE_CHANNEL_ID }}
      BUFFER_FACEBOOK_CHANNEL_ID: ${{ secrets.BUFFER_FACEBOOK_CHANNEL_ID }}
      BUFFER_INSTAGRAM_CHANNEL_ID: ${{ secrets.BUFFER_INSTAGRAM_CHANNEL_ID }}
      BUFFER_TIKTOK_CHANNEL_ID: ${{ secrets.BUFFER_TIKTOK_CHANNEL_ID }}
      HORROR_REVIEW_GENRE: ${{ inputs.horror_genre || '' }}
      DURABLE_SUBMISSION_GUARD: 'true'
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ needs.produce.outputs.sha }}
        fetch-depth: 0
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install media finishing dependencies
      run: 'sudo apt-get update -qq

        sudo apt-get install -y ffmpeg

        python -m pip install numpy Pillow requests beautifulsoup4 google-api-python-client google-auth-oauthlib'
    - uses: actions/download-artifact@v4
      with:
        name: original-voice-${{ github.run_id }}
        path: professional_motion/delivery/
    - uses: actions/download-artifact@v4
      with:
        pattern: frames-*
        path: professional_motion/chunks/
        merge-multiple: true
    - name: Join every original frame without gaps or repetition
      run: python -m professional_motion.merge_chunks
    - name: Mix quieter music and verify the actual 90–180 second movie
      id: finish
      run: 'python -m professional_motion.finish

        python -m professional_motion.cli rendered science --slot "${{ needs.produce.outputs.slot }}"'
    - name: Persist the completed episode and its exact video checksum
      if: steps.finish.outcome == 'success'
      run: python -m professional_motion.persist_state
    - name: Schedule approved daily film for exactly 17:00 Cairo
      if: steps.finish.outcome == 'success' && needs.produce.outputs.publish == 'true'
      run: python -m professional_motion.cli publish science --slot "${{ needs.produce.outputs.slot }}" --due "${{ needs.produce.outputs.due }}"
      id: publication
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: science-professional-${{ github.run_id }}
        path: 'professional_motion/output/

          professional_motion/delivery/

          state/professional_topics.json'
        retention-days: 30
        if-no-files-found: warn
    - name: Preserve partial provider acceptance receipts on any failure
      if: always()
      run: python -m professional_motion.persist_state
    - name: Update safe review evidence
      if: always()
      env:
        REVIEW_STAGE: finished
        REVIEW_ONLY: ${{ needs.produce.outputs.publish != 'true' }}
      run: python -m professional_motion.review_evidence
    - name: Deliver the actual verified full-length movie downloads
      if: always() && steps.finish.outcome == 'success'
      run: python -m professional_motion.deliver_media
  failure-alert:
    needs:
    - produce
    - render
    - finish
    if: ${{ inputs.pipeline != 'v2' && always() && (failure() || cancelled()) }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
    - name: Open an alert issue on failure
      uses: actions/github-script@v7
      with:
        script: "await github.rest.issues.create({\n  owner: context.repo.owner,\n  repo: context.repo.repo,\n  title: '\\u0641\\u0634\\u0644 \\u0627\\u0644\\u0625\\u0646\\u062a\\u0627\\u062c \\u0627\\u0644\\u064a\\u0648\\u0645\\u064a \\u2014 run ' + context.runId,\n  body: '\\u062a\\u0634\\u063a\\u064a\\u0644\\u0629 \\u0627\\u0644\\u0625\\u0646\\u062a\\u0627\\u062c \\u0627\\u0644\\u064a\\u0648\\u0645\\u064a \\u0641\\u0634\\u0644\\u062a \\u0623\\u0648 \\u0627\\u062a\\u0644\\u063a\\u064a\\u062a.\\nRun: ' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId + '\\n\\u0627\\u0644\\u0631\\u062c\\u0627\\u0621 \\u0645\\u0631\\u0627\\u062c\\u0639\\u0629 \\u0627\\u0644\\u0644\\u0648\\u062c \\u0648\\u0625\\u0639\\u0627\\u062f\\u0629 \\u0627\\u0644\\u062a\\u0634\\u063a\\u064a\\u0644.',\n  assignees: ['ahmedalsharqwi2-gif']\n});"
