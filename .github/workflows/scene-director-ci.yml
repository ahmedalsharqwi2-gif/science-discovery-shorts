name: Scene director regression
on:
  push:
    paths:
      - 'film_factory/scene_director.py'
      - 'film_factory/motion_kit_timeline.py'
      - 'tests/test_scene_director.py'
      - '.github/workflows/scene-director-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_scene_director.py' -v
