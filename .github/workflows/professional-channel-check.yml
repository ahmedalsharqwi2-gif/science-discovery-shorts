{
  "name": "Verify exactly three connected active science destinations without posting",
  "on": {
    "push": {
      "branches": [
        "codex/daily-professional-factory"
      ],
      "paths": [
        ".github/workflows/professional-channel-check.yml"
      ]
    }
  },
  "permissions": {
    "contents": "write"
  },
  "jobs": {
    "probe": {
      "runs-on": "ubuntu-latest",
      "env": {
        "PYTHONPATH": "${{ github.workspace }}",
        "PYTHONUNBUFFERED": "1",
        "GITHUB_TOKEN": "${{ github.token }}",
        "BUFFER_API_KEY": "${{ secrets.BUFFER_API_KEY }}",
        "BUFFER_CHANNEL_IDS": "${{ secrets.BUFFER_CHANNEL_IDS || vars.BUFFER_CHANNEL_IDS }}",
        "YT_CLIENT_ID": "${{ secrets.YT_CLIENT_ID }}",
        "YT_CLIENT_SECRET": "${{ secrets.YT_CLIENT_SECRET }}",
        "YT_REFRESH_TOKEN": "${{ secrets.YT_REFRESH_TOKEN }}",
        "YT_REFRESH_TOKEN_FALLBACK": "${{ secrets.YT_REFRESH_TOKEN_FALLBACK }}",
        "BUFFER_YOUTUBE_CHANNEL_ID": "${{ secrets.BUFFER_YOUTUBE_CHANNEL_ID }}",
        "BUFFER_FACEBOOK_CHANNEL_ID": "${{ secrets.BUFFER_FACEBOOK_CHANNEL_ID }}",
        "BUFFER_INSTAGRAM_CHANNEL_ID": "${{ secrets.BUFFER_INSTAGRAM_CHANNEL_ID }}",
        "BUFFER_TIKTOK_CHANNEL_ID": "${{ secrets.BUFFER_TIKTOK_CHANNEL_ID }}"
      },
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.11"
          }
        },
        {
          "run": "python -m pip install requests beautifulsoup4 google-api-python-client google-auth-oauthlib"
        },
        {
          "name": "Verify three configured destinations against live Buffer accounts",
          "run": "python - <<'PY2'\nimport json\nfrom pathlib import Path\nfrom professional_motion.publisher import preflight\nexpected=json.loads(Path('config/professional_destinations.json').read_text())['buffer_channel_ids']\nresult=preflight('science',True)\nassert len(expected)==3 and result['buffer']==expected, 'Expected exactly the three user-confirmed destinations'\nassert result['direct_youtube'] is False, 'No duplicate direct upload route'\nPath('professional_motion/delivery/three-destinations-verified.json').write_text(json.dumps({'profile':'science','verified':True,'destinations':result['matched_channels'],'no_posts_created':True},ensure_ascii=False,indent=2))\nprint(json.dumps(result['matched_channels'],ensure_ascii=False))\nPY2"
        },
        {
          "name": "Retain safe read-only channel evidence",
          "if": "always()",
          "env": {
            "REVIEW_STAGE": "three-destinations-verification",
            "REVIEW_ONLY": "true"
          },
          "run": "python -m professional_motion.review_evidence"
        }
      ],
      "timeout-minutes": 5
    }
  }
}
