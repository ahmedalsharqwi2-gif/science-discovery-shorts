{
  "name": "Read-only confirmed science publishing destination check",
  "on": {
    "push": {
      "branches": [
        "codex/daily-professional-factory"
      ],
      "paths": [
        ".github/workflows/professional-channel-check.yml"
      ]
    }
  },
  "permissions": {
    "contents": "write"
  },
  "jobs": {
    "probe": {
      "runs-on": "ubuntu-latest",
      "env": {
        "PYTHONPATH": "${{ github.workspace }}",
        "PYTHONUNBUFFERED": "1",
        "GEMINI_API_KEY": "${{ secrets.GEMINI_API_KEY }}",
        "GEMINI_TEXT_API_KEY": "${{ secrets.GEMINI_TEXT_API_KEY || secrets.GEMINI_API_KEY }}",
        "GEMINI_TTS_API_KEY": "${{ secrets.GEMINI_TTS_API_KEY || secrets.GEMINI_API_KEY }}",
        "GITHUB_TOKEN": "${{ github.token }}",
        "GH_RELEASE_TOKEN": "${{ secrets.GH_RELEASE_TOKEN }}",
        "BUFFER_API_KEY": "${{ secrets.BUFFER_API_KEY }}",
        "BUFFER_CHANNEL_IDS": "${{ secrets.BUFFER_CHANNEL_IDS || vars.BUFFER_CHANNEL_IDS }}",
        "YT_CLIENT_ID": "${{ secrets.YT_CLIENT_ID }}",
        "YT_CLIENT_SECRET": "${{ secrets.YT_CLIENT_SECRET }}",
        "YT_REFRESH_TOKEN": "${{ secrets.YT_REFRESH_TOKEN }}",
        "YT_REFRESH_TOKEN_FALLBACK": "${{ secrets.YT_REFRESH_TOKEN_FALLBACK }}",
        "BUFFER_YOUTUBE_CHANNEL_ID": "${{ secrets.BUFFER_YOUTUBE_CHANNEL_ID }}",
        "BUFFER_FACEBOOK_CHANNEL_ID": "${{ secrets.BUFFER_FACEBOOK_CHANNEL_ID }}",
        "BUFFER_INSTAGRAM_CHANNEL_ID": "${{ secrets.BUFFER_INSTAGRAM_CHANNEL_ID }}",
        "BUFFER_TIKTOK_CHANNEL_ID": "${{ secrets.BUFFER_TIKTOK_CHANNEL_ID }}"
      },
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.11"
          }
        },
        {
          "run": "python -m pip install requests beautifulsoup4 google-api-python-client google-auth-oauthlib"
        },
        {
          "name": "Read channel identities only; do not upload or schedule anything",
          "run": "python -m professional_motion.cli preflight science\npython - <<'PY2'\nimport subprocess\nfrom pathlib import Path\ndef git(*args,data=None):return subprocess.check_output(['git',*args],input=data).decode().strip()\np=Path('professional_motion/delivery/publishing-preflight.json')\nb=git('hash-object','-w',str(p));tree=git('mktree',data=('100644 blob '+b+'\\tpublishing-preflight.json\\n').encode());c=git('-c','user.name=destination-check-bot','-c','user.email=bot@users.noreply.github.com','commit-tree',tree,'-m','Read-only destination verification [skip ci]');git('push','origin',c+':refs/heads/codex/destination-check-'+__import__('os').environ['GITHUB_RUN_ID'])\nPY2"
        }
      ]
    }
  }
}
