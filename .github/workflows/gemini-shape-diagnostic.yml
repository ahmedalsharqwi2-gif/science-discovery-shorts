{"name":"Gemini generationConfig shape diagnostic","on":{"workflow_dispatch":{}},"permissions":{"contents":"read"},"jobs":{"test":{"runs-on":"ubuntu-24.04","steps":[{"name":"Test payload variants","shell":"bash","env":{"KEY":"${{ secrets.GEMINI_TEXT_API_KEY || secrets.GEMINI_API_KEY }}"},"run":"set -u\npython3 - <<'PY'\nimport json,os,subprocess,tempfile\nkey=os.environ['KEY']; url='https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent'; base={'contents':[{'parts':[{'text':'Return JSON with ok true.'}]}]}\nvariants={\n'plain':base,\n'responseSchema':{**base,'generationConfig':{'responseMimeType':'application/json','responseSchema':{'type':'OBJECT','properties':{'ok':{'type':'BOOLEAN'}},'required':['ok']},'maxOutputTokens':32}},\n'responseJsonSchema':{**base,'generationConfig':{'responseMimeType':'application/json','responseJsonSchema':{'type':'object','properties':{'ok':{'type':'boolean'}},'required':['ok']},'maxOutputTokens':32}}}\nfor name,payload in variants.items():\n f=tempfile.NamedTemporaryFile(delete=False);json.dump(payload,f);f.close(); out=subprocess.run(['curl','-sS','--max-time','60','-o',f.name+'.out','-w','%{http_code}','-H','Content-Type: application/json','-H',f'x-goog-api-key: {key}','-d','@'+f.name,url],capture_output=True,text=True); body=open(f.name+'.out').read(); print(name,'HTTP',out.stdout,'BODY',' '.join(body.split())[:500])\nPY"}]}}}
