{
  "name": "Remotion original voice; retained intent and measured speech",
  "on": {
    "push": {
      "branches": [
        "main"
      ],
      "paths": [
        ".github/remotion-request.json"
      ]
    }
  },
  "permissions": {
    "contents": "write",
    "actions": "read"
  },
  "concurrency": {
    "group": "professional-daily-science",
    "cancel-in-progress": false
  },
  "jobs": {
    "voice": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 45,
      "env": {
        "PYTHONPATH": "${{ github.workspace }}",
        "PYTHONUNBUFFERED": "1",
        "GITHUB_TOKEN": "${{ github.token }}",
        "GEMINI_API_KEY": "${{ secrets.GEMINI_API_KEY }}",
        "GEMINI_TTS_API_KEY": "${{ secrets.GEMINI_TTS_API_KEY || secrets.GEMINI_API_KEY }}",
        "GEMINI_TTS_RUN_BUDGET": "1"
      },
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "fetch-depth": 0
          }
        },
        {
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.11"
          }
        },
        {
          "name": "Install original narration and ASR prerequisites",
          "run": "sudo apt-get update -qq\nsudo apt-get install -y ffmpeg\npython -m pip install requests numpy Pillow beautifulsoup4 faster-whisper==1.2.1"
        },
        {
          "uses": "actions/cache/restore@v4",
          "with": {
            "path": ".voice_cache\nstate/api_budget.sqlite3\n~/.cache/huggingface",
            "key": "remotion-voice-v1-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}",
            "restore-keys": "remotion-voice-v1-${{ github.repository_id }}-\nprofessional-v3-${{ github.repository_id }}-\nprofessional-v2-${{ github.repository_id }}-"
          }
        },
        {
          "name": "Reserve this real story once and recover earlier retained audio",
          "run": "python -m remotion_factory.prepare"
        },
        {
          "name": "Generate once with this repository's Charon key, then measure real speech",
          "run": "python -m remotion_factory.voice_job"
        },
        {
          "uses": "actions/upload-artifact@v4",
          "if": "always()",
          "with": {
            "name": "remotion-voice-${{ github.run_id }}-${{ github.run_attempt }}",
            "path": "professional_motion/delivery/\nstate/remotion_registry.json",
            "retention-days": 30,
            "if-no-files-found": "warn"
          }
        },
        {
          "uses": "actions/cache/save@v4",
          "if": "always()",
          "with": {
            "path": ".voice_cache\nstate/api_budget.sqlite3\n~/.cache/huggingface",
            "key": "remotion-voice-v1-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}"
          }
        }
      ]
    }
  }
}
