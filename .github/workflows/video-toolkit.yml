name: Video Toolkit Check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'video-toolkit/**'
      - '.github/workflows/video-toolkit.yml'
permissions:
  contents: read
concurrency:
  group: video-toolkit-${{ github.ref }}
  cancel-in-progress: false
jobs:
  install-and-render:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: video-toolkit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: video-toolkit/package-lock.json
      - name: Install pinned video libraries
        run: npm ci --no-fund --no-audit
      - name: Install Chromium and FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          npx playwright install --with-deps chromium
      - name: Build scenes, check browser effects, render and verify MP4
        run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: video-toolkit-verified
          path: video-toolkit/output/
          if-no-files-found: error
          retention-days: 7
