{
  "name": "Audit current daily science film against actual Buffer post channels times and media",
  "on": {
    "push": {
      "branches": [
        "main"
      ],
      "paths": [
        ".github/workflows/professional-audit-daily-release.yml"
      ]
    }
  },
  "permissions": {
    "contents": "write"
  },
  "jobs": {
    "audit": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 5,
      "env": {
        "BUFFER_API_KEY": "${{ secrets.BUFFER_API_KEY }}"
      },
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "ref": "main"
          }
        },
        {
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.11"
          }
        },
        {
          "run": "python -m pip install requests beautifulsoup4"
        },
        {
          "run": "python -m professional_motion.audit_daily_release science"
        },
        {
          "name": "Retain actual read-only provider evidence",
          "if": "always()",
          "run": "python -m professional_motion.review_evidence"
        }
      ]
    }
  }
}
