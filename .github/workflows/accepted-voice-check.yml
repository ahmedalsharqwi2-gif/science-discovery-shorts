name: Accepted Voice Integration Check
on:
  push:
    branches: [main]
    paths: ['voice_provider/**', 'config/accepted_voice.json', 'scripts/generate_voice.py', '.github/workflows/accepted-voice-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract-and-syntax:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m compileall -q voice_provider scripts/generate_voice.py
      - run: python -m unittest discover -s voice_provider/tests -v
