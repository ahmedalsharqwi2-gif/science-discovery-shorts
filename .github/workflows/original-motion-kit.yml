name: Original Motion Kit Linux renderer
on:
  workflow_dispatch:
  push:
    paths:
      - 'Motion_as_kit/**'
      - 'Motion_as_kit_Linux_ready.zip'
      - '.github/workflows/original-motion-kit.yml'
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Unpack single uploaded archive
        run: |
          if [ -f Motion_as_kit_Linux_ready.zip ]; then unzip -oq Motion_as_kit_Linux_ready.zip; fi
          test -f Motion_as_kit/app/package.json
      - uses: oven-sh/setup-bun@v2
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          cd Motion_as_kit/app
          bun install
          bunx playwright install --with-deps chromium
      - name: Render original kit, not primitive replacement
        working-directory: Motion_as_kit/app
        env:
          BROWSER_CHANNEL: chromium
        run: |
          mkdir -p ../out
          bun scripts/render.ts video --from 0 --to 10 --fps 30 --samples 1 --crf 19 --noaudio --out ../out/motion-kit-10s.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: motion-kit-native-render-${{ github.run_id }}
          path: Motion_as_kit/out/motion-kit-10s.mp4
          retention-days: 14
