name: Original Motion Kit Linux renderer
on:
  workflow_dispatch:
  push:
    paths:
      - 'Motion_as_kit/**'
      - 'Motion_as_kit_Linux_ready.zip'
      - '.github/workflows/original-motion-kit.yml'
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Unpack single uploaded archive
        run: |
          if [ -f Motion_as_kit_Linux_ready.zip ]; then unzip -oq Motion_as_kit_Linux_ready.zip; fi
          test -f Motion_as_kit/app/package.json
      - name: Generate missing audio and lyric timing metadata
        run: |
          python - <<'PY'
          import json, pathlib, math
          p=pathlib.Path("Motion_as_kit/app/public/data")
          p.mkdir(parents=True,exist_ok=True)
          duration=62
          fps=60
          names=["rms","low","mid","high","vocal","drums","bass","other"]
          features={name:[round(0.08+0.03*math.sin(i/19),4) for i in range(duration*fps+1)] for name in names}
          phrases=[
            ("What if I told you you can create motion graphics like this",0,5),
            ("This is Claude",5,10),
            ("For example",10,17),
            ("where it gets crazy",17,24),
            ("It writes the animation",24,31),
            ("Then that code",31,38),
            ("So instead of",38,45),
            ("And because the animation",45,53),
            ("Does this replace",53,62),
          ]
          lines=[]
          for index,(phrase,start,end) in enumerate(phrases):
            words=phrase.split()
            linewords=[dict(w=word,start=round(start+(end-start)*j/len(words),3),end=round(start+(end-start)*(j+1)/len(words),3)) for j,word in enumerate(words)]
            lines.append(dict(i=index,text=phrase,start=start,end=end,words=linewords))
          (p/"audio.approx.json").write_text(json.dumps(dict(duration=duration,bpm=110,fps=fps,beats=[],downbeats=[],sections=[],features=features,onsets={})))
          (p/"lyrics.approx.json").write_text(json.dumps(dict(lines=lines)))
          PY
      - uses: oven-sh/setup-bun@v2
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          cd Motion_as_kit/app
          bun install
          bunx playwright install --with-deps chromium
      - name: Render original kit, not primitive replacement
        working-directory: Motion_as_kit/app
        env:
          BROWSER_CHANNEL: chromium
        run: |
          mkdir -p ../out
          bun scripts/render.ts video --from 0 --to 10 --fps 30 --samples 1 --crf 19 --noaudio --out ../out/motion-kit-10s.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: motion-kit-native-render-${{ github.run_id }}
          path: Motion_as_kit/out/motion-kit-10s.mp4
          retention-days: 14
