name: Original Motion Kit Linux renderer
on:
  workflow_dispatch:
  push:
    paths:
      - 'Motion_as_kit/**'
      - 'motion_3d/aerodynamics.ts'
      - 'Motion_as_kit_Linux_ready.zip'
      - '.github/workflows/original-motion-kit.yml'
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Unpack single uploaded archive
        run: |
          if [ -f Motion_as_kit_Linux_ready.zip ]; then unzip -oq Motion_as_kit_Linux_ready.zip; fi
          test -f Motion_as_kit/app/package.json
      - name: Generate missing audio and lyric timing metadata
        run: |
          python - <<'PY'
          import json, pathlib, math
          p=pathlib.Path("Motion_as_kit/app/public/data")
          p.mkdir(parents=True,exist_ok=True)
          duration=93
          fps=60
          names=["rms","low","mid","high","vocal","drums","bass","other"]
          features={name:[round(0.08+0.03*math.sin(i/19),4) for i in range(duration*fps+1)] for name in names}
          phrases=[
            ("What if I told you… you can create motion graphics like this without even opening After Effects?",0.09,6.0),
            ("And no — I’m not talking about an After Effects MCP.",6.5,9.68),
            ("This is Claude Opus 5.5.",10.1,12.59),
            ("Instead of controlling After Effects, you basically tell Claude what you want the animation to look like.",13.11,18.19),
            ("For example:",19.36,19.92),
            ("“Create a 15-second cinematic motion graphics sequence with kinetic typography, smooth shape transitions, 3D elements and seamless camera movement.”",20.31,29.38),
            ("And this is where it gets crazy.",29.91,32.04),
            ("Claude doesn’t actually generate an MP4 directly.",32.44,35.2),
            ("It writes the animation itself as code.",35.62,38.24),
            ("The text, shapes, positions, easing, transitions, particles — basically every visual element is defined mathematically over time.",38.79,47.76),
            ("Then that code is rendered frame by frame and turned into a video.",48.16,51.87),
            ("So instead of: After Effects → layers → keyframes → graph editor → render",52.29,57.87),
            ("you’re essentially doing: Prompt → code → render → video.",58.24,62.34),
            ("And because the animation is procedural, you can literally tell Claude:",62.76,66.63),
            ("“Make this transition smoother.”",66.93,68.37),
            ("“Change the colour.”",68.79,69.61),
            ("“Slow this section down.”",69.93,71.24),
            ("“Make the ending seamlessly loop into the beginning.”",71.71,74.14),
            ("And it can modify the underlying animation instead of you manually moving hundreds of keyframes.",74.76,80.21),
            ("Does this replace After Effects?",80.76,82.65),
            ("Not really.",83.2,83.88),
            ("But for certain types of motion graphics…",84.16,86.12),
            ("the fact that you can go from an idea to a working animation without touching a timeline is pretty insane.",86.33,92.53),
          ]
          lines=[]
          for index,(phrase,start,end) in enumerate(phrases):
            words=phrase.split()
            linewords=[]
            for j,word in enumerate(words):
              a=round(start+(end-start)*j/len(words),3)
              b=round(start+(end-start)*(j+1)/len(words),3)
              syl=[[round(a+(b-a)*k/3,3),round(a+(b-a)*(k+1)/3,3)] for k in range(3)]
              linewords.append(dict(w=word,start=a,end=b,syl=syl))
            lines.append(dict(i=index,text=phrase,start=start,end=end,words=linewords))
          (p/"audio.approx.json").write_text(json.dumps(dict(duration=duration,bpm=110,fps=fps,beats=[],downbeats=[],sections=[],features=features,onsets={})))
          (p/"lyrics.approx.json").write_text(json.dumps(dict(lines=lines)))
          PY
      - name: Replace demo timeline with original-engine science scene
        run: |
          cp motion_3d/aerodynamics.ts Motion_as_kit/app/src/scenes/aerodynamics.ts
          python - <<'PY'
          from pathlib import Path
          p=Path("Motion_as_kit/app/src/timeline.ts")
          s=p.read_text()
          i=s.index("export function makeTimeline(")
          s=s[:i]+"""export function makeTimeline(_ly: Lyrics, _au: AudioData): TimelineEntry[] {
            return [{ id: 'aerodynamics', load: scene('aerodynamics'), start: 0, end: 8 }];
          }
          """
          p.write_text(s)
          PY
      - uses: oven-sh/setup-bun@v2
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          cd Motion_as_kit/app
          bun install
          bunx playwright install --with-deps chromium
      - name: Render original kit, not primitive replacement
        working-directory: Motion_as_kit/app
        env:
          BROWSER_CHANNEL: chromium
        run: |
          mkdir -p ../out
          set -o pipefail
          bun scripts/render.ts video --from 0 --to 8 --fps 30 --samples 1 --crf 19 --noaudio --out ../out/motion-kit-10s.mp4 2>&1 | tee ../out/render.log
          if grep -q 'SCENE ERRORS:' ../out/render.log; then echo 'Scenes failed: reject red fallback video'; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: motion-kit-native-render-${{ github.run_id }}
          path: Motion_as_kit/out/motion-kit-10s.mp4
          retention-days: 14
