name: Review pipeline
on:
  pull_request:
    paths-ignore: ['docs/**', 'state/**', '**/*.md']
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        default: review
        options: [review, publish]
  schedule:
    - cron: '0 14,15 * * *'
permissions:
  contents: read
concurrency:
  group: review-${{ github.repository }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - run: make test
  review:
    needs: verify
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - id: slot
        run: node pipeline/schedule.mjs >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: github.event_name != 'schedule' || steps.slot.outputs.due == 'true'
        with: {python-version: '3.11', cache: pip}
      - if: github.event_name != 'schedule' || steps.slot.outputs.due == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg tesseract-ocr
          pip install -r requirements.txt
          npx remotion browser ensure
          node pipeline/restore-state.mjs
      - uses: actions/cache/restore@v4
        id: provider-cache
        with:
          path: |
            .cache/gemini
            .cache/voice
          key: gemini-v2-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: gemini-v2-${{ github.repository_id }}-
      - if: github.event_name != 'schedule' || steps.slot.outputs.due == 'true'
        run: make review
        env:
          MODE: ${{ inputs.mode || 'review' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TEXT_API_KEY: ${{ secrets.GEMINI_TEXT_API_KEY }}
          GEMINI_TTS_API_KEY: ${{ secrets.GEMINI_TTS_API_KEY }}
      - uses: actions/cache/save@v4
        if: always() && steps.provider-cache.outputs.cache-primary-key != ''
        with:
          path: |
            .cache/gemini
            .cache/voice
          key: gemini-v2-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-${{ github.run_id }}
          path: out/
          if-no-files-found: ignore
          retention-days: 14
      - if: always() && (github.event_name != 'schedule' || steps.slot.outputs.due == 'true')
        run: node pipeline/store-review.mjs
