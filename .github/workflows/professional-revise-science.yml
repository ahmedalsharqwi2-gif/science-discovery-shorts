{
  "name": "Complete same science episode with source-reviewed full-length narration",
  "on": {
    "push": {
      "branches": [
        "main"
      ],
      "paths": [
        ".github/workflows/professional-revise-science.yml"
      ]
    }
  },
  "permissions": {
    "contents": "write",
    "actions": "write"
  },
  "jobs": {
    "stop-short": {
      "runs-on": "ubuntu-24.04",
      "steps": [
        {
          "name": "Cancel only the measured 106.6-second attempt before publication",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "python - <<'PY2'\nimport os,json,urllib.request,urllib.error\nbase='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/41053663227'\nheaders={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}\nreq=urllib.request.Request(base,headers=headers)\nwith urllib.request.urlopen(req) as r:state=json.load(r)\nif state['status']!='completed':\n try:\n  with urllib.request.urlopen(urllib.request.Request(base+'/cancel',headers=headers,data=b'',method='POST')) as r:print('Cancellation accepted:',r.status)\n except urllib.error.HTTPError as e:\n  if e.code!=409:raise RuntimeError('Cancel API HTTP '+str(e.code))\nelse:print('The short attempt has already stopped')\nPY2"
        }
      ]
    },
    "revise": {
      "needs": "stop-short",
      "runs-on": "ubuntu-24.04",
      "concurrency": {
        "group": "professional-daily-science",
        "cancel-in-progress": false
      },
      "env": {
        "GEMINI_API_KEY": "${{ secrets.GEMINI_API_KEY }}",
        "GEMINI_TEXT_API_KEY": "${{ secrets.GEMINI_TEXT_API_KEY || secrets.GEMINI_API_KEY }}",
        "GITHUB_TOKEN": "${{ github.token }}"
      },
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "ref": "main",
            "fetch-depth": 0
          }
        },
        {
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.11"
          }
        },
        {
          "run": "python -m pip install requests beautifulsoup4"
        },
        {
          "run": "python -m professional_motion.revise_short_daily\npython -m professional_motion.persist_state"
        },
        {
          "name": "Save safe revision evidence",
          "if": "always()",
          "run": "python -m professional_motion.review_evidence"
        }
      ]
    },
    "factory": {
      "needs": "revise",
      "uses": "./.github/workflows/professional-daily.yml",
      "with": {
        "mode": "daily"
      },
      "secrets": "inherit"
    }
  }
}
