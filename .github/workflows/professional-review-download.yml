{
  "name": "Deliver verified professional review download",
  "on": {
    "push": {
      "branches": [
        "codex/daily-professional-factory"
      ],
      "paths": [
        ".github/workflows/professional-review-download.yml"
      ]
    }
  },
  "permissions": {
    "contents": "write",
    "actions": "read"
  },
  "jobs": {
    "download": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 35,
      "env": {
        "GITHUB_TOKEN": "${{ github.token }}",
        "REVIEW_PROFILE": "science",
        "REVIEW_WORKFLOW": "professional-daily.yml"
      },
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.11"
          }
        },
        {
          "run": "sudo apt-get update -qq\nsudo apt-get install -y ffmpeg\npython -m pip install requests\npython professional_motion/download_review.py"
        }
      ]
    }
  }
}
