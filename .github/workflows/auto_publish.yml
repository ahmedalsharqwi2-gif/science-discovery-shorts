{
  "name": "اسرار الكون — daily photographic factory",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "publish": {
          "description": "Publish to configured social channels",
          "type": "boolean",
          "default": true
        },
        "use_approved_sample": {
          "description": "Reuse approved complete sample with improved motion",
          "type": "boolean",
          "default": false
        }
      }
    },
    "schedule": [
      {
        "cron": "10 13 * * *",
        "timezone": "Africa/Cairo"
      }
    ],
    "push": {
      "branches": [
        "main"
      ],
      "paths": [
        ".github/workflows/auto_publish.yml"
      ]
    }
  },
  "permissions": {
    "contents": "write",
    "actions": "read"
  },
  "concurrency": {
    "group": "science-auto-publish",
    "cancel-in-progress": false
  },
  "jobs": {
    "produce-and-publish": {
      "if": "${{ github.event_name == 'workflow_dispatch' && !inputs.publish }}",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 60,
      "env": {
        "GEMINI_API_KEY": "${{ secrets.GEMINI_API_KEY }}",
        "CLOUDFLARE_API_TOKEN": "${{ secrets.CLOUDFLARE_API_TOKEN }}",
        "CLOUDFLARE_ACCOUNT_ID": "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}",
        "BUFFER_API_KEY": "${{ secrets.BUFFER_API_KEY }}",
        "BUFFER_CHANNEL_ID": "${{ secrets.BUFFER_CHANNEL_ID }}",
        "BUFFER_YOUTUBE_CHANNEL_ID": "${{ secrets.BUFFER_YOUTUBE_CHANNEL_ID }}",
        "BUFFER_FACEBOOK_CHANNEL_ID": "${{ secrets.BUFFER_FACEBOOK_CHANNEL_ID }}",
        "BUFFER_INSTAGRAM_CHANNEL_ID": "${{ secrets.BUFFER_INSTAGRAM_CHANNEL_ID }}",
        "BUFFER_TIKTOK_CHANNEL_ID": "${{ secrets.BUFFER_TIKTOK_CHANNEL_ID }}",
        "YT_CLIENT_ID": "${{ secrets.YT_CLIENT_ID }}",
        "YT_CLIENT_SECRET": "${{ secrets.YT_CLIENT_SECRET }}",
        "YT_REFRESH_TOKEN": "${{ secrets.YT_REFRESH_TOKEN }}",
        "YT_REFRESH_TOKEN_FALLBACK": "${{ secrets.YT_REFRESH_TOKEN_FALLBACK }}",
        "GEMINI_TEXT_API_KEY": "${{ secrets.GEMINI_TEXT_API_KEY || secrets.GEMINI_API_KEY }}",
        "GEMINI_TTS_API_KEY": "${{ secrets.GEMINI_TTS_API_KEY || secrets.GEMINI_API_KEY }}",
        "BUFFER_CHANNEL_IDS": "${{ secrets.BUFFER_CHANNEL_IDS || vars.BUFFER_CHANNEL_IDS }}",
        "GITHUB_TOKEN": "${{ github.token }}",
        "PYTHONPATH": "${{ github.workspace }}",
        "PYTHONUNBUFFERED": "1",
        "CHANNEL_BRAND": "اسرار الكون",
        "PUBLICATION_RECEIPTS_ENABLED": "true",
        "BUFFER_SCHEDULE_MODE": "customScheduled",
        "PUBLISH_IMMEDIATE": "${{ github.event_name == 'push' && github.event.head_commit.message == 'Activate approved daily factory and publish first episode' }}",
        "PRODUCTION_MEDIA_ID": "${{ (github.event_name == 'push' && github.event.head_commit.message == 'Activate approved daily factory and publish first episode') && 'approved-photo-v3-science' || github.run_id }}",
        "USE_APPROVED_SAMPLE": "${{ inputs.use_approved_sample || (github.event_name == 'push' && github.event.head_commit.message == 'Activate approved daily factory and publish first episode') }}",
        "FIRST_APPROVED_PUBLISH": "${{ github.event_name == 'push' && github.event.head_commit.message == 'Activate approved daily factory and publish first episode' }}"
      },
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "ref": "main"
          }
        },
        {
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.11"
          }
        },
        {
          "name": "Select unique 17:00 Cairo publication slot",
          "id": "slot",
          "run": "python scripts/daily_schedule.py\npython - <<'PY'\nimport os\nif os.getenv('FIRST_APPROVED_PUBLISH') == 'true':\n with open(os.environ['GITHUB_ENV'],'a') as f:f.write('PUBLISH_IMMEDIATE=true\\n')\nPY"
        },
        {
          "name": "Install validation dependencies",
          "run": "python -m pip install requests Pillow numpy beautifulsoup4\npython -m compileall -q film_factory scripts\npython -m unittest discover -s tests -p test_daily_cinema.py -v",
          "if": "${{ (steps.slot.outputs.already_confirmed != 'true' || env.PUBLISH_IMMEDIATE == 'true' || inputs.use_approved_sample) }}"
        },
        {
          "name": "Verify intended publishing destinations before generation",
          "if": "${{ (steps.slot.outputs.already_confirmed != 'true' || env.PUBLISH_IMMEDIATE == 'true' || inputs.use_approved_sample) && ((github.event_name != 'workflow_dispatch' || inputs.publish)) }}",
          "run": "python -m film_factory.publish science --preflight"
        },
        {
          "uses": "actions/cache/restore@v4",
          "with": {
            "path": ".voice_cache\n.image_cache\n.film_work\nstate/api_budget.sqlite3\n~/.cache/huggingface",
            "key": "documented-factory-v2-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}",
            "restore-keys": "documented-factory-v2-${{ github.repository_id }}-\nfilm-state-v1-${{ github.repository_id }}-"
          },
          "if": "${{ (steps.slot.outputs.already_confirmed != 'true' || env.PUBLISH_IMMEDIATE == 'true' || inputs.use_approved_sample) }}"
        },
        {
          "uses": "actions/cache/restore@v4",
          "with": {
            "path": "output/",
            "key": "documented-slot-v2-${{ github.repository_id }}-${{ env.PUBLISH_DATE }}-${{ env.USE_APPROVED_SAMPLE }}-${{ github.run_id }}-${{ github.run_attempt }}",
            "restore-keys": "documented-slot-v2-${{ github.repository_id }}-${{ env.PUBLISH_DATE }}-${{ env.USE_APPROVED_SAMPLE }}-"
          },
          "if": "${{ (steps.slot.outputs.already_confirmed != 'true' || env.PUBLISH_IMMEDIATE == 'true' || inputs.use_approved_sample) }}"
        },
        {
          "name": "Install encoding dependencies",
          "run": "sudo apt-get update -qq\nsudo apt-get install -y ffmpeg fonts-dejavu-core\npython -m pip install google-api-python-client google-auth-oauthlib",
          "if": "${{ (steps.slot.outputs.already_confirmed != 'true' || env.PUBLISH_IMMEDIATE == 'true' || inputs.use_approved_sample) }}"
        },
        {
          "name": "Recover approved complete photographic sample",
          "if": "${{ (steps.slot.outputs.already_confirmed != 'true' || env.PUBLISH_IMMEDIATE == 'true' || inputs.use_approved_sample) && (env.USE_APPROVED_SAMPLE == 'true') }}",
          "uses": "actions/download-artifact@v4",
          "with": {
            "name": "science-photographic-review-39637804329",
            "run-id": "39637804329",
            "github-token": "${{ github.token }}",
            "path": "output"
          }
        },
        {
          "name": "Install alignment only when generating new speech",
          "if": "${{ (steps.slot.outputs.already_confirmed != 'true' || env.PUBLISH_IMMEDIATE == 'true' || inputs.use_approved_sample) && (env.USE_APPROVED_SAMPLE != 'true') }}",
          "run": "python -m pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu\npython -m pip install -r film_factory/requirements.txt"
        },
        {
          "name": "Enrich approved complete sample with speech-cued motion and stereo sound",
          "if": "${{ (steps.slot.outputs.already_confirmed != 'true' || env.PUBLISH_IMMEDIATE == 'true' || inputs.use_approved_sample) && (env.USE_APPROVED_SAMPLE == 'true') }}",
          "run": "python scripts/refresh_approved_sample.py science"
        },
        {
          "name": "Produce a fresh documented episode with Charon",
          "if": "${{ (steps.slot.outputs.already_confirmed != 'true' || env.PUBLISH_IMMEDIATE == 'true' || inputs.use_approved_sample) && (env.USE_APPROVED_SAMPLE != 'true') }}",
          "run": "python -m film_factory.produce science"
        },
        {
          "name": "Publish or schedule only the complete verified video",
          "if": "${{ (steps.slot.outputs.already_confirmed != 'true' || env.PUBLISH_IMMEDIATE == 'true' || inputs.use_approved_sample) && ((github.event_name != 'workflow_dispatch' || inputs.publish)) }}",
          "run": "python -m film_factory.publish science"
        },
        {
          "name": "Preserve complete video and publication evidence",
          "if": "always()",
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "science-daily-cinema-${{ github.run_id }}",
            "path": "output/\nstate/publication_stock.json",
            "retention-days": 30,
            "if-no-files-found": "warn"
          }
        },
        {
          "uses": "actions/cache/save@v4",
          "if": "always()",
          "with": {
            "path": ".voice_cache\n.image_cache\n.film_work\nstate/api_budget.sqlite3\n~/.cache/huggingface",
            "key": "documented-factory-v2-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}"
          }
        },
        {
          "uses": "actions/cache/save@v4",
          "if": "always()",
          "with": {
            "path": "output/",
            "key": "documented-slot-v2-${{ github.repository_id }}-${{ env.PUBLISH_DATE }}-${{ env.USE_APPROVED_SAMPLE }}-${{ github.run_id }}-${{ github.run_attempt }}"
          }
        },
        {
          "name": "Persist actual receipts and topic history even after partial failure",
          "if": "always()",
          "run": "git config user.name content-bot\ngit config user.email bot@users.noreply.github.com\nfor path in state/publication_stock.json state/film_topics.json state/yt_token_last_success.json state/news_history.json; do\n  if [ -f \"$path\" ]; then git add \"$path\"; fi\ndone\nif git diff --cached --quiet; then exit 0; fi\ngit commit -m 'Persist daily video and actual publication receipts [skip ci]'\nfor attempt in 1 2 3; do\n  if git pull --rebase --autostash origin main && git push origin HEAD:main; then exit 0; fi\n  sleep 3\ndone\nexit 1"
        }
      ]
    }
  }
}