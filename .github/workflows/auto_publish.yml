name: Auto publish videos (Cairo 12-18)
on:
  schedule:
    # Prepare at 06:00/12:00 UTC, at least three hours before Cairo publication.
    # Final publication remains 12:00 and 18:00 Africa/Cairo, including DST changes.
    - cron: '0 6 * * *'
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      voice_profile:
        description: 'SILMA voice profile'
        required: false
        default: 'auto'
        type: string
      dry_run:
        description: 'Build and validate without publishing externally'
        required: false
        default: false
        type: boolean
      publish_now:
        description: 'Publish immediately to compensate for a missed slot'
        required: false
        default: false
        type: boolean

concurrency:
  group: auto-publish-voice-rotation
  cancel-in-progress: false

permissions:
  contents: write

env:
  CLIP_REVIEW_ENABLED: 'false'
  QUALITY_GATES_BLOCKING: 'false'
  BACKGROUND_MUSIC_ENABLED: 'true'
  BACKGROUND_MUSIC_VOLUME: '0.07'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  PYTHONPATH: ${{ github.workspace }}

jobs:
  publish:
    runs-on: ubuntu-latest
    # Cold SILMA/Whisper setup plus TTS and FFmpeg can exceed one hour.
    timeout-minutes: 180
    steps:
      - name: Set fixed publication slot
        env:
          SCHEDULE_EXPR: ${{ github.event.schedule }}
          PUBLISH_NOW: ${{ inputs.publish_now || false }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timedelta, timezone
          from zoneinfo import ZoneInfo

          now = datetime.now(timezone.utc)
          cairo_now = now.astimezone(ZoneInfo("Africa/Cairo"))
          expression = os.environ.get("SCHEDULE_EXPR", "")
          if os.environ.get("PUBLISH_NOW", "false").lower() == "true":
              # The full render, Whisper alignment, and B-roll gates can take
              # 30–60 minutes. Keep the catch-up slot safely in the future so
              # Buffer accepts it when the pipeline reaches publication.
              target = datetime.now(timezone.utc) + timedelta(minutes=90)
              due_at = target.isoformat(timespec="seconds").replace("+00:00", "Z")
              print(f"Immediate catch-up publication slot: {due_at} UTC")
              with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
                  env_file.write(f"PUBLISH_DUE_AT={due_at}\n")
              raise SystemExit(0)
          target_hour = {"0 6 * * *": 12, "0 12 * * *": 18}.get(expression)
          if target_hour is None:
              slots = [cairo_now.replace(hour=12, minute=0, second=0, microsecond=0),
                       cairo_now.replace(hour=18, minute=0, second=0, microsecond=0)]
              target = next((slot for slot in slots if slot > cairo_now), slots[0] + timedelta(days=1))
          else:
              target = cairo_now.replace(hour=target_hour, minute=0, second=0, microsecond=0)
              if target <= cairo_now:
                  target += timedelta(days=1)
          due_at = target.astimezone(timezone.utc).isoformat(timespec="seconds").replace("+00:00", "Z")
          print(f"Fixed publication slot: {due_at} UTC")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"PUBLISH_DUE_AT={due_at}\n")
          PY

      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache models
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: hf-models-v1

      - name: Validate publishing configuration
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_IDS: ${{ secrets.BUFFER_CHANNEL_IDS }}
          GH_RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -n "$BUFFER_API_KEY" || { echo "ERROR: BUFFER_API_KEY is missing"; exit 1; }
          test -n "$BUFFER_CHANNEL_IDS" || { echo "ERROR: BUFFER_CHANNEL_IDS is missing"; exit 1; }
          test -n "$GH_RELEASE_TOKEN" || { echo "ERROR: GitHub release token is missing"; exit 1; }
          echo "Publishing credentials and channel mapping are present."

      - name: Validate and resolve AI model policy
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_FALLBACK_API_KEY: ${{ secrets.LLM_FALLBACK_API_KEY || secrets.GROQ_API_KEY }}
          LLM_FALLBACK_ENDPOINT: ${{ vars.LLM_FALLBACK_ENDPOINT || 'https://api.groq.com/openai/v1/chat/completions' }}
          # Current Groq production model; preflight still confirms it is
          # exposed by the account before the provider is considered healthy.
          LLM_FALLBACK_MODEL: ${{ vars.LLM_FALLBACK_MODEL || vars.GROQ_MODEL || 'openai/gpt-oss-20b' }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MODEL_POLICY_FILE: config/model_policy.json
        run: python scripts/model_preflight.py

      - name: Generate and publish
        env:
          # --- LLM provider: Gemini (primary) ---
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Check the exact model name in Google AI Studio; several names can be
          # given separated by commas and they are tried in order.
          GEMINI_THINKING_LEVEL: 'low'
          GEMINI_MIN_OUTPUT_TOKENS: '0'
          GEMINI_RETRIES: '3'
          # Compact narration for 45–59 second reels at the natural Edge rate.
          LLM_MAX_COMPLETION_TOKENS: '2048'
          PYTHONUNBUFFERED: '1'
          LLM_TIMEOUT: '45'

          # --- LLM provider: OpenRouter (optional fallback only) ---
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MAX_ATTEMPTS: '3'
          OPENROUTER_TITLE: 'Auto Publish Reels'
          GEMINI_RATE_LIMIT: '0.2'
          GEMINI_RATE_BURST: '1'
          OPENROUTER_RATE_LIMIT: '0.5'
          OPENROUTER_RATE_BURST: '1'
          OPENROUTER_POOL_ATTEMPTS: '2'
          # --- Third provider: any OpenAI-compatible endpoint (Groq by default) ---
          LLM_FALLBACK_API_KEY: ${{ secrets.LLM_FALLBACK_API_KEY || secrets.GROQ_API_KEY }}
          LLM_FALLBACK_ENDPOINT: ${{ vars.LLM_FALLBACK_ENDPOINT || 'https://api.groq.com/openai/v1/chat/completions' }}
          # Resolve this per-run from the provider's /models endpoint above.
          LLM_FALLBACK_REASONING_EFFORT: 'low'
          LLM_FALLBACK_RETRIES: '2'
          FALLBACK_RATE_LIMIT: '0.5'
          FALLBACK_RATE_BURST: '1'
          LLM_POOL_BACKOFF_BASE: '2'
          LLM_POOL_BACKOFF_MAX: '30'

          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PEXELS_REQUIRED: 'true'
          ENGINEERING_PILOT_ENABLED: 'true'
          TOPIC_BANK_REQUIRED: 'false'
          TOPIC_SELECTION_MODE: 'dynamic'
          TOPIC_ROTATION_SEED: ${{ github.run_id }}
          TOPIC_PERFORMANCE_FILE: 'topic_performance.json'
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_IDS: ${{ secrets.BUFFER_CHANNEL_IDS }}
          GH_RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

          # --- Duration and word-count window ---
          # Reels target 45–59 seconds. Keep a one-second safety margin
          # so encoding/container rounding cannot push a published video over
          # the platform limit.
          MIN_AUDIO_SECONDS: '45'
          MAX_AUDIO_SECONDS: '59'
          TARGET_AUDIO_SECONDS: '55'
          # main.py reads MIN_WORDS/MAX_WORDS; the final MP3 duration remains
          # the authoritative gate around this 110–135 word window.
          MIN_WORDS: '110'
          MAX_WORDS: '135'
          # BUFFER_CHANNEL_IDS is stored positionally as TikTok, YouTube,
          # Facebook in this repository's secret.
          PUBLISH_CHANNELS: 'tiktok,youtube,facebook'
          PUBLISH_DRY_RUN: ${{ inputs.dry_run || false }}
          # Publish at the fixed slot computed above, never at Buffer's queue time.
          BUFFER_SCHEDULE_MODE: 'customScheduled'
          REQUIRE_EXTERNAL_SOURCES: 'false'
          EDITORIAL_REVIEW_ENABLED: 'true'
          MIN_TASHKEEL_COVERAGE_WARN: '0.85'
          MIN_TASHKEEL_COVERAGE_FATAL: '0.65'
          # Full scientific Fact Check and external source-link requirements
          # are intentionally disabled for this publishing pipeline.
          FACT_CHECK_ENABLED: 'false'
          TOPIC_GENERATION_MAX_ATTEMPTS: '3'
          VOICE_ROTATION_ENABLED: 'true'
          VOICE_SELECTION_MODE: 'content'
          AUTO_VOICE_PROFILES: 'mohamed_elbed,rafik_sa,egyptian_female,hossam,hossam_uploaded,marwan,nassim,ahmed_z'
          VOICE_ROTATION_STATE_FILE: 'state/voice_rotation.json'
          MIN_SCENE_CLIPS: '4'

          # --- Topic history ---
          TOPIC_HISTORY_FILE: 'topic_history.json'


          # --- TTS ---
          TTS_ENGINE: "edge"
          # Hamed has clearer connected Arabic phonemes for scientific terms.
          EDGE_TTS_VOICES: "ar-SA-HamedNeural"
          EDGE_TTS_VOICE: "ar-SA-HamedNeural"
          SILMA_REFERENCE_PROFILE: ${{ inputs.voice_profile || 'auto' }}
          SILMA_VOICE_PROFILES_FILE: 'assets/voices/voice_profiles.json'
          # قراءة طبيعية أبطأ؛ لا نسرّع الصوت ولا نضغط الكلمات.
          SILMA_SPEED: '1.08'
          SILMA_MAX_ATTEMPTS: '2'
          SILMA_MIN_SCORE: '0.6'
          SILMA_GUARD_ENABLED: 'true'
          WHISPER_MODEL: 'base'
          ASR_MIN_MATCH_RATIO: '0.82'
          MIN_TTS_AUDIO_SCORE: '0.78'
          SILMA_FALLBACK_TO_EDGE: 'true'
          # Avoid the slow, syllable-separated delivery seen with -15%.
          EDGE_TTS_RATE: "-10%"
          EDGE_TTS_PITCH: "+0Hz"
          MUSIC_VOLUME: '0.07'
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}

        run: |
          test -f main.py || { echo "ERROR: main.py is missing"; exit 1; }
          test -f llm_gemini.py || { echo "ERROR: llm_gemini.py is missing"; exit 1; }
          test -f tts_quality.py || { echo "ERROR: tts_quality.py is missing"; exit 1; }
          test -f assets/voices/voice_profiles.json || { echo "ERROR: voice profiles config is missing"; exit 1; }
          python main.py

      - name: Verify final montage and B-roll output
        run: |
          test -s output/final_video.mp4 || { echo "ERROR: final video missing or empty"; exit 1; }
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 output/final_video.mp4
          ffprobe -v error -show_entries format=duration -of csv=p=0 output/final_video.mp4
          echo "Professional vertical montage with topic-specific Pexels B-roll verified."

      - name: Persist topic history
        if: success()
        run: |
          if [ ! -f topic_history.json ] && [ ! -f state/voice_rotation.json ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add topic_history.json state/voice_rotation.json
          if git diff --cached --quiet; then
            echo "No topic-history changes to persist."
            exit 0
          fi
          git commit -m 'chore: persist published topic history'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Preserve clip review candidates
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: clip-review-candidates
          path: |
            state/clip_review_requests.json
            state/clip_reviews.json
            output/pexels_clips/raw_*
          if-no-files-found: ignore
          retention-days: 3
