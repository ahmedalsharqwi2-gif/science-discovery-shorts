name: Replenish 3-day video stock
on:
  schedule:
    - cron: '37 3 * * *'
  workflow_dispatch:
permissions:
  actions: write
  contents: read
concurrency:
  group: replenish-stock
  cancel-in-progress: false
jobs:
  replenish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Dispatch missing future publication slots
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRODUCTION_WORKFLOW: auto_publish.yml
        run: python scripts/replenish_stock.py
