name: Replenish rolling 4-day video stock
# Owner pause: automatic stock scheduling removed on 2026-10-18.
on:
  workflow_dispatch:
permissions:
  actions: write
  contents: read
concurrency:
  group: replenish-stock
  cancel-in-progress: false
jobs:
  replenish:
    # Publishing paused by owner request on 2026-10-17.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Dispatch missing future publication slots
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRODUCTION_WORKFLOW: auto_publish.yml
        run: python scripts/replenish_stock.py
